<div class="min-h-screen bg-slate-50/50 p-6 md:p-8 font-sans">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Loading Skeleton -->
    <div *ngIf="loading" class="space-y-6">
      <div class="h-28 bg-white rounded-3xl p-6 border border-slate-100 animate-pulse flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 bg-slate-200 rounded-2xl"></div>
          <div class="space-y-2">
            <div class="h-5 w-40 bg-slate-200 rounded"></div>
            <div class="h-3 w-24 bg-slate-200 rounded"></div>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
        <div *ngFor="let i of [1,2,3,4,5,6]" class="h-24 bg-white rounded-2xl p-4 border border-slate-100 animate-pulse"></div>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-3xl flex items-center justify-between shadow-xs">
      <div class="flex items-center gap-3">
        <i class="pi pi-exclamation-circle text-xl text-red-500"></i>
        <span class="text-sm font-semibold">{{ error }}</span>
      </div>
      <button (click)="loadData()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl transition">
        Thử lại
      </button>
    </div>

    <!-- Dashboard Main Content -->
    <div *ngIf="!loading && !error && dashboardData" class="space-y-8">
      
      <!-- 1. Interactive Performance Chart Component -->
      <!-- <app-dashboard-chart 
        [statistics]="dashboardData.statistics" 
        [weeklyProgress]="dashboardData.weeklyProgress">
      </app-dashboard-chart> -->

      <!-- 2. Integrated Dashboard Widgets Component -->
      <!-- <app-dashboard-widget></app-dashboard-widget> -->

    </div>
  </div>
</div>
